<div class="carousel-inner background" role="listbox">
        
        <img src="rurapenthe-endor_banner.jpg" alt="Rura Penthe und Endor">
</div>

<div class="container">
    <div class="container-content">  
        <div>
            <app-collapsible #colWhatsIs
                [title]="'Rura Penthe'"
                [icon]="'rurapenthe_logo_symbol.png'">
                <app-whats-is/>
            </app-collapsible>

            <app-collapsible #colTimeCapsule
                [title]="'Rura Penthe Zeitkapsel'"
                [icon]="'rurapenthe_logo_symbol.png'">
                <app-time-capsule/>
            </app-collapsible>
            <app-collapsible #colEndor
                [title]="'Endor'"
                [icon]="'endor_logo_symbol.png'">
                <app-endor/>
            </app-collapsible>
            <app-collapsible #colCalcalculator
                [title]="'Con-Beitrag Kalkulator'">
                <app-calculator/>
            </app-collapsible>
            <app-collapsible #colRegistration
                [title]="'Informationen und Anmeldung'" >
                <app-registration (jump)="openCollapsible($event)"/>
            </app-collapsible>
            <app-collapsible #colImpressum
                [title]="'Impressum'" >
                <app-impressum/>
            </app-collapsible>
        </div>
        <div class="mt-1"></div>
    </div>
</div>
